<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login</title>
    <link rel="icon" type="image/png" href="dashboard.png">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0&icon_names=login" />
    <style>
        body{
            background-color: #111;
            font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, 'Open Sans', 'Helvetica Neue', sans-serif;
        }
        main{
            display: flex;
            justify-content: center;
            align-items: center;
            text-align: center;
            gap: 20px;
        }
        .form{
            display: flex;
            flex-direction: column;
            gap: 20px;
            color: white;
            height: 300px;
            width: 300px;
            text-align: center;
        }
        h1{
            color: #ea580c;
        }
        .login{
            margin-top: 100px;
        }
        input{
            color: #ea580c;
            outline: none;
            background-color: #222;
            border: 2px solid #ea580c;
            padding: 10px 6px;
            font-size: 12px;
            border-radius: 12px;
        }
        input:focus{
            outline: 2px solid #ea5a0c;
        }
        button{
            background-color: #222;
            padding: 10px 10px;
            border-radius: 10px;
            border: 2px solid #ea580c;
            color: white;
            transition: all 0.3s ease-in-out;
            cursor: pointer;
        }
        button:hover{
            transform: scale(1.02);
            background-color: #ea5a0c;
            border: 2px solid #ea5a0c;
        }
        button:active{
            transform: scale(0.95);
        }
    </style>
</head>
<body>
    <main>
        <div class="login">
            <form class="form" onsubmit="login(event)">
                <h1>Login Dashboard (Demo)</h1>
                    <label class="label">Username</label>
                    <input type="text" name="name" id="name"  required placeholder="Username...." autocomplete="off" autofocus/>
                    <label for="password" class="label">Password</label>
                    <input type="password" name="password" id="passwd"  required placeholder="Password...." autocomplete="off" autofocus/>
                </span>
                <a style="color: gray; cursor: pointer;" onclick="alert('For the Demo version of my dashboard is Username: admin, Password: admin1234')">Password or Username forget?</a>
                <button type="submit" style="display: flex; justify-content: center; align-items: center; gap: 2px;"><span style="color:#ea580c" class="material-symbols-outlined">login</span>Submit</button>
                <a style="color: gray; cursor: pointer;">Version: 2.0</a>
            </form>

        </div>
    </main>

    <script>
        function login(e){
            e.preventDefault();
            //ids from input pw and name
            const name = document.getElementById('name').value;
            const pw = document.getElementById('passwd').value;            

            //for Demos is this okay! But for real Login system is this NOT SECURE!!            
            if(name === 'admin' && pw === 'admin1234'){
                window.location.replace('dashboard.html')
            }
            else{
                alert('Password or Username was wrong!')
            }
        }
    </script>
</body>
</html>
