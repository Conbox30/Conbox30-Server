<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Conbox30 Dashboard</title>
    <link rel="icon" type="image/png" href="/dashboard.png">
    <style>
        body {
            font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, 'Open Sans', 'Helvetica Neue', sans-serif;
            background-color: #111;
            color: white;
        }
        header {
            background-color: #222;
            border-bottom: 2px solid #ea580c;
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            z-index: 10;
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 20px;
            padding: 1px 20px;
            flex-wrap: wrap;
            
        }
        .main {
            display: flex;
            justify-content: center;
            align-items: center;
            text-align: center;
            gap: 28px;
            flex-wrap: wrap;
        }
        .card {
            background-color: #222;
            color: white;
            height: 200px;
            width: 300px;
            border-radius: 24px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 10px;
            box-sizing: border-box;
            transition: all 0.3ms;
        }
        .card:hover{
            border:2px solid #ea580c;
            box-shadow: 0 0 20px #ea580c;
        }
        button {
            background-color: #111;
            color: white;
            padding: 8px 8px;
            border: 2px solid #ea580c;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.3s;
        }
        button:hover {
            transform: scale(1.1);
            background-color: #ea580c;
        }
        button:active{
            transform: scale(0.98);
        }
        .loginout{
            background-color: #ff0000a2;
            color: white;
            border:2px solid #ff0000;
            padding: 8px 8px;
            border-radius: 12px;
            transition: all 0.3s;
            cursor: pointer;
            text-align: center;
            
        }
        .loginout:hover{
            background-color: #ff0000;
        }
        a{
            text-decoration: none;
            color: #ea580c;
            cursor: pointer;
        }
        .menu{
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 10px;
            border: 2px solid #ea580e;
            border-radius: 24px;
            width: 460px;
            height: 55px;
        }
        .menu a:hover{
            background-color: #333;
            height: 55px;
            border-radius: 8px;
        }
        .monitor{
            display: flex;
            justify-content: center;
            align-items: center;
            text-align: center;
            gap: 28px;
            flex-wrap: wrap;
        }
        .btnshutdown{
            background: #ff0000a2;
            color: white;
            border: 2px solid #ff0000;
            cursor: pointer;
            transition: all 0.3s;
            padding: 8px 8px;
            border-radius: 12px;
        }
        .btnshutdown:hover{
            background-color: #ea580c;
            border: 2px solid #ea580c;
            color: white;
            transform: scale(1.06);
        }
        .btnshutdown:active{
            transform: scale(0.98);
        }
    </style>
</head>
<body>
    <header>
        <h1><span id="name"></span> System:</h1>
        <div class="menu">
            <a onclick="Goto('dashboard')" style="display: flex; justify-content: center; align-items: center; gap: 2px;"><img src="/home_24dp_EA580C_FILL0_wght400_GRAD0_opsz24.png" alt=""> Dashboard</a>
            <a onclick="Goto('monitor')" style="display: flex; justify-content: center; align-items: center; gap: 2px;"><img src="/monitor_heart_24dp_EA580C_FILL0_wght400_GRAD0_opsz24.png" alt=""> System Monitor</a>
            <a onclick="Goto('shutdown')" style="display: flex; justify-content: center; align-items: center; gap: 2px;"><img src="/power_settings_new_24dp_EA580C_FILL0_wght400_GRAD0_opsz24.png" alt=""> Power</a>
            <form action="/logout" method="post">
                <button class="loginout" id="loginout" style="display: flex; justify-content: center; align-items: center; gap: 2px;"><img src="/logout_24dp_FFFFFF_FILL0_wght400_GRAD0_opsz24.png" alt=""> Logout</button>
            </form>
        </div> 
    </header>
    
    <div style="margin-top: 120px;"></div>
    <div class="main">
        <div class="main" id="dashboard">
            <div class="card">
                <h1>RAM:</h1>
                <div style="color: #ea580c;" id="free"></div>
                <p id="ram-last" style="color: #ea580c; margin-top: 5px;"></p>
            </div>

            <div class="card">
                <h1>CPU:</h1>
                <div id="cpu" style="color: #ea580c;"></div>
                <h3 id="temp" style="color: #ea580c; "></h3>
            </div>

            <div class="card" >
                <h1>UPTIME:</h1>
                <div id="uptime" style="color: #ea580c;"></div>
            </div>

            <div class="card">
                <h1>NAME & PLATFORM:</h1>
                <p id="name2" style="color: #ea580c; margin: 0;"></p>
                <div id="platform" style="color: #ea580c;"></div>
            </div>

            <div class="card">
                <h1>Disk:</h1>
                <div id="disk" style="color: #ea580c;"></div>
            </div>
        </div>
        
        <div id="monitor" class="monitor" style="display: none;">
            <div class="card">
                <h1>SSH Status:</h1>
                <h2 id="sshstatus" style="color: #ea580c;"></h2>
            </div>

            <div class="card">
                <h1>SMB Status:</h1>
                <h2 id="status" style="color: #ea580c;"></h2>
            </div>
        </div>

        <div class="card" style="display: none;" id="shutdown">
            <h1>Shutdown or Reboot?</h1>
            <div>
                <button onclick="reboot()">Reboot</button>
                <button onclick="shutdown()" class="btnshutdown">Shutdown</button>
            </div>
        </div>
    </div>

    <script>
        async function reboot() {
            const answer = confirm("Reboot?");
            if (!answer) return;

            try {
                const response = await fetch('/api/reboot', {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'}
                });
                const data = await response.json();
                alert(data.message);
            } catch (err) {
                console.error('Reboot was not successful: ', err);
                alert('Error: Command could not be sent.');
            }
        }

        async function shutdown() {
            const shutdownque = confirm('Shutdown?');
            if (!shutdownque) return;

            try {
                const response = await fetch('/api/shutdown', {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'}
                });
                const data = await response.json();
                alert(data.message);
            } catch (err) {
                console.error('Shutdown has an error: ', err);
                alert('Error: Command could not be sent.');
            }
        }

        async function datafromOS() {
            try {
                let datafromfetch = await fetch('/api/system-info', {
                    method: 'POST'
                });
                const data = await datafromfetch.json();

                function formatUptime(seconds) {
                    const d = Math.floor(seconds / (3600 * 24));
                    const h = Math.floor((seconds % (3600 * 24)) / 3600);
                    const m = Math.floor((seconds % 3600) / 60);
                    const s = Math.floor(seconds % 60);

                    return `${d}d ${h}h ${m}m ${s}s`;
                }

                const freeram = (data.freeMemory / (1024 ** 3)).toFixed(1);
                const totalram = (data.totalMemory / (1024 ** 3)).toFixed(1);

                document.getElementById('uptime').textContent = formatUptime(data.uptime);
                document.getElementById('free').textContent = `Free RAM: ${freeram} GB, Total RAM: ${totalram} GB`;
                document.getElementById('ram-last').textContent = `Ram Used: ${data.ramPercent}%`;
                        
                document.getElementById('cpu').textContent = `${data.cpuname} x ${data.cpus}`;
                document.getElementById('name').textContent = data.hostname;
                
                document.getElementById('platform').textContent = `${data.platform} ${data.architecture}`;
                document.getElementById('temp').textContent = `CPU Last: ${data.cpuPercent} Temp: ${data.temp}`;

                document.getElementById('disk').textContent = data.disk;
                document.getElementById('name2').textContent = data.hostname;

                document.getElementById('sshstatus').textContent = `SSH Status: ${data.services.ssh}`
                document.getElementById('status').textContent = `SMB Status: ${data.services.smb}`;
                        
            } catch (error) {
                console.error('Error fetching data from Server:', error);
            }
        } 
        
        function Goto(divids){
            document.getElementById('dashboard').style.display = 'none';
            document.getElementById('shutdown').style.display = 'none';
            document.getElementById('monitor').style.display = 'none';

            if(divids){
                document.getElementById(divids).style.display = 'flex';
            }
        }

        datafromOS();
        setInterval(datafromOS, 1000);
    </script>
</body>
</html>
