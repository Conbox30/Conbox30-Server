<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login</title>
    <link rel="icon" type="image/png" href="/dashboard.png">
    <style>
        body{
            background-color: #111;
            font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, 'Open Sans', 'Helvetica Neue', sans-serif;
        }
        main{
            display: flex;
            justify-content: center;
            align-items: center;
            text-align: center;
            gap: 20px;
        }
        .form{
            display: flex;
            flex-direction: column;
            gap: 20px;
            color: white;
            height: 300px;
            width: 300px;
            text-align: center;
        }
        h1{
            color: #ea580c;
        }
        .login{
            margin-top: 100px;
        }
        input{
            color: #ea580c;
            outline: none;
            background-color: #222;
            border: 2px solid #ea580c;
            padding: 10px 6px;
            font-size: 12px;
            border-radius: 12px;
        }
        input:focus{
            outline: 2px solid #ea5a0c;
        }
        button{
            background-color: #222;
            padding: 10px 10px;
            border-radius: 10px;
            border: 2px solid #ea580c;
            color: white;
            transition: all 0.3s ease-in-out;
            cursor: pointer;
        }
        button:hover{
            transform: scale(1.02);
            background-color: #ea5a0c;
            border: 2px solid #ea5a0c;
        }
        button:active{
            transform: scale(0.95);
        }
    </style>
</head>
<body>
    <main>
        <div class="login">
            <form class="form" action="/dashboard" method="post">
                <h1>Login Dashboard</h1>
                <label>Username:</label>
                <input type="text" name="name"  required placeholder="Username" autocomplete="off" autofocus/>

                <label>Password:</label>
                <input type="password" name="password"  required placeholder="Username" autocomplete="off" autofocus/>
                <button type="submit" style="display: flex; justify-content: center; align-items: center; gap: 2px;" ><img src="login_24dp_EA580C_FILL0_wght400_GRAD0_opsz24.png" alt=""> Submit</button>
            </form>

        </div>
    </main>
</body>
</html>
