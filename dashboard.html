<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Conbox30 Dashboard</title>
    <link rel="icon" type="image/png" href="/dashboard.png">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" />
    <style>
        body {
            font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, 'Open Sans', 'Helvetica Neue', sans-serif;
            background-color: #111;
            color: white;
        }
        header {
            background-color: #222;
            border-bottom: 2px solid #ea580c;
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            z-index: 10;
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 20px;
            padding: 1px 20px;
            flex-wrap: wrap;
            
        }
        .main {
            display: flex;
            justify-content: center;
            align-items: center;
            text-align: center;
            gap: 28px;
            flex-wrap: wrap;
        }
        .card {
            background-color: #222;
            color: white;
            height: 200px;
            width: 300px;
            border-radius: 24px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 10px;
            box-sizing: border-box;
            transition: all 0.3ms;
        }
        .card:hover{
            border:2px solid #ea580c;
            box-shadow: 0 0 20px #ea580c;
        }
        button {
            background-color: #111;
            color: white;
            padding: 8px 8px;
            border: 2px solid #ea580c;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.3s;
        }
        button:hover {
            transform: scale(1.1);
            background-color: #ea580c;
        }
        button:active{
            transform: scale(0.98);
        }
        .loginout{
            background-color: #ff0000a2;
            color: white;
            border:2px solid #ff0000;
            padding: 8px 8px;
            border-radius: 12px;
            transition: all 0.3s;
            cursor: pointer;
            text-align: center;
            
        }
        .loginout:hover{
            background-color: #ff0000;
        }
        a{
            text-decoration: none;
            color: #ea580c;
            cursor: pointer;
        }
        .menu{
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 10px;
            border: 2px solid #ea580e;
            border-radius: 24px;
            width: 460px;
            height: 55px;
        }
        .menu a:hover{
            background-color: #333;
            height: 55px;
            border-radius: 8px;
        }
        .monitor{
            display: flex;
            justify-content: center;
            align-items: center;
            text-align: center;
            gap: 28px;
            flex-wrap: wrap;
        }
        .btnshutdown{
            background: #ff0000a2;
            color: white;
            border: 2px solid #ff0000;
            cursor: pointer;
            transition: all 0.3s;
            padding: 8px 8px;
            border-radius: 12px;
        }
        .btnshutdown:hover{
            background-color: #ea580c;
            border: 2px solid #ea580c;
            color: white;
            transform: scale(1.06);
        }
        .btnshutdown:active{
            transform: scale(0.98);
        }
    </style>
</head>
<body>
    <header>
        <h1>nas3 System:</h1>
        <div class="menu">
            <a onclick="Goto('dashboard')" style="display: flex; justify-content: center; align-items: center; gap: 2px;"><span class="material-symbols-outlined" style="color: #ea580e;">home</span>Dashboard</a>
            <a onclick="Goto('monitor')" style="display: flex; justify-content: center; align-items: center; gap: 2px;"><span class="material-symbols-outlined">monitor_heart</span> System Monitor</a>
            <a onclick="Goto('shutdown')" style="display: flex; justify-content: center; align-items: center; gap: 2px;"><span class="material-symbols-outlined" style="color: #ea580e;">power_settings_new</span> Power</a>
            <button class="loginout" id="loginout" style="display: flex; justify-content: center; align-items: center; gap: 2px;"><span class="material-symbols-outlined">logout</span> Logout</button>
        </div> 
    </header>
    
    <div style="margin-top: 120px;"></div>
    <div class="main">
        <div class="main" id="dashboard">
            <div class="card">
                <h1>RAM:</h1>
                <div style="color: #ea580c;" id="free"></div>
                <p id="ram-last" style="color: #ea580c; margin-top: 5px;"></p>
            </div>

            <div class="card">
                <h1>CPU:</h1>
                <div id="cpu" style="color: #ea580c;"></div>
                <h3 id="cpu-last" style="color: #ea580c;"></h3>
            </div>

            <div class="card">
                <h1>UPTIME:</h1>
                <div id="uptime" style="color: #ea580c;"></div>
            </div>

            <div class="card">
                <h1>NAME & PLATFORM:</h1>
                <p id="name" style="color: #ea580c; margin: 0;"></p>
                <div id="platform" style="color: #ea580c;"></div>
            </div>

            <div class="card">
                <h1>Disk:</h1>
                <div id="disk" style="color: #ea580c;"></div>
            </div>
        </div> 
            
        <div id="monitor" class="monitor" style="display: none;">
            <div class="card">
                <h1>SSH Status:</h1>
                <h2 id="sshstatus" style="color: #ea580c;">SSH Status: running🟢</h2>
            </div>

            <div class="card">
                <h1>SMB Status:</h1>
                <h2 id="status" style="color: #ea580c;">SMB Status: running🟢</h2>
            </div>
        </div>

        <div class="card" style="display: none;" id="shutdown">
            <h1>Shutdown or Reboot?</h1>
            <div>
                <button onclick="alert('Reboot! Demo version')">Reboot</button>
                <button onclick="alert('Shutdown! Demo version')" class="btnshutdown">Shutdown</button>
            </div>
        </div>
    </div>

    <script>
        function datafromos(){
            //RAM
            document.getElementById('free').innerText = 'Free RAM: 8 GB, Total RAM: 12 GB';
            document.getElementById('ram-last').innerText = `Ram Used: 4 GB`;

            //CPU
            const last = Math.round(Math.random() * 80)
            document.getElementById('cpu').innerText = `Intel(R) N100 x 4`;
            document.getElementById('cpu-last').innerText = `CPU Last: ${last}% Temp: 52.0C`

            uptime();
            //Time and Name/Platfrom    
            let sec = 0;
            let min = 47;
            let hours = 18;
            let days = 5;
            function uptime(){
                setInterval(function(){
                    sec++;
                    if (sec >= 60) {
                        sec = 0;
                        min++;
                    }
                    if (min >= 60) {
                        min = 0;
                        hours++;
                    }
                    if (hours >= 24) {
                        hours = 0;
                        days++;
                    }
                      document.getElementById('uptime').innerText = `${days}d ${hours}h ${min}m ${sec}s`;
                },1000)
            }
            
            document.getElementById('name').innerText = 'nas3';
            document.getElementById('platform').innerText = 'linux x64';

            //Disk:
            document.getElementById('disk').innerText = `50G / 500GB (10%)`;
        }
        datafromos();
        setInterval(datafromos,2000)
        //Function show divs
        function Goto(divids){
            document.getElementById('monitor').style.display = 'none';
            document.getElementById('dashboard').style.display = 'none';
            document.getElementById('shutdown').style.display = 'none';

            if(divids){
                document.getElementById(divids).style.display = 'flex';
            }
        }
        document.getElementById('loginout').addEventListener('click', function(){
            window.location.replace('index.html');
        })
    </script>
</body>
</html>
